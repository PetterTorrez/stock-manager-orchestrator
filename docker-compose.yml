services:
  mysql-db:
    image: mysql:8.4
    container_name: mysql-dev
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=bluedotroot1234
      - MYSQL_DATABASE=stock_manager
      - MYSQL_USER=bluedot
      - MYSQL_PASSWORD=bluedot1234
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./api-stock-manager
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    container_name: backend-api
    depends_on:
      - mysql-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/stock_manager
      SPRING_DATASOURCE_USERNAME: bluedot
      SPRING_DATASOURCE_PASSWORD: bluedot1234

  frontend:
    build:
      context: ./web-stock-manager
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    container_name: frontend-web

volumes:
  mysql_data:

